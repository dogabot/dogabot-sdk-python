[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dogabot-sdk"
version = "0.1.0"
description = "Official dogabot REST API SDK for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "dogabot" }]
keywords = ["dogabot", "trading", "sdk", "api"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
